name: Check source
on:
  push:
    branches: [neko_dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI does not ship debug binaries; avoid generating/caching their debug symbols.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, lint and frontend
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    container:
      # Fork PR tokens may not read the repository's container package.
      image: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ghcr.io/nekoos-group/nekocrate-linux-builder@sha256:28ed1cb76480e7a82a7dbf0b534640ddacca72e2da47c85b41532b2aadec5ce4' || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Install Linux build dependencies
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: sudo bash scripts/install_linux_dependencies.sh libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: python3 scripts/frontend_artifact.py verify app/dist
      - run: python3 -m unittest discover -s scripts/tests
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: ci-frontend
          path: app/dist
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  filesystem:
    # Only OS-dependent filesystem behavior; the full suite and Clippy run once above.
    name: Filesystem behavior (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Check filesystem behavior and platform-specific launch regressions
        run: cargo test -p nekocrate-core --lib --locked -- verification::tests storage::tests tests::linked_directories tests::removing_linked_instance folder_import::tests java::tests::windows modloader_tests::forge_launch_arguments modloader_tests::legacy_forge_import version_management::tests
