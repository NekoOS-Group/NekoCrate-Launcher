name: Build and publish preview release
run-name: "${{ github.event_name == 'push' && 'Queue' || 'Build and publish' }} ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags: ["dev*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag to build
        required: true
        default: dev0.6
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  dispatch:
    # Tag-scoped caches cannot be restored by the next release tag. Run the
    # build on the default branch, but still check out and verify the exact tag.
    name: Queue release on the shared cache branch
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'release.yml',
              ref: context.payload.repository.default_branch,
              inputs: { tag: process.env.RELEASE_TAG },
            });
            core.info(`Queued ${process.env.RELEASE_TAG} on ${context.payload.repository.default_branch}`);

  prepare:
    name: Reuse checked frontend
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
      ci_run: ${{ steps.ci.outputs.run }}
      frontend_artifact: ${{ steps.ci.outputs.artifact }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version
        run: python scripts/release_assets.py check-version --tag "$RELEASE_TAG"
      - name: Check updater signing key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Configure TAURI_SIGNING_PRIVATE_KEY before publishing updater packages."; exit 1; }
      - name: Wait for successful CI on this exact commit
        id: ci
        uses: actions/github-script@v7
        env:
          RELEASE_COMMIT: ${{ steps.revision.outputs.commit }}
        with:
          script: |
            const sha = process.env.RELEASE_COMMIT;
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 100,
              });
              const run = data.workflow_runs.filter(run =>
                run.head_sha === sha &&
                run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                ((run.event === 'push' && ['neko_dev', 'main'].includes(run.head_branch)) ||
                  run.event === 'workflow_dispatch')
              ).sort((a, b) => b.id - a.id)[0];
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(`CI did not pass (${run.conclusion}): ${run.html_url}`);
                }
                const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
                  ...context.repo, run_id: run.id, name: 'ci-frontend', per_page: 100,
                });
                const artifact = artifacts.find(item =>
                  item.name === 'ci-frontend' && !item.expired && item.size_in_bytes > 0
                );
                if (!artifact) {
                  throw new Error(`Frontend artifact expired or missing; rerun CI: ${run.html_url}`);
                }
                core.setOutput('run', run.id);
                core.setOutput('artifact', artifact.id);
                core.info(`Reusing frontend checked at ${sha}: ${run.html_url}`);
                return;
              }
              if (!run && attempt >= 3) {
                throw new Error(`No CI run for ${sha}; push this commit to neko_dev/main or run Check source on this ref.`);
              }
              core.info(`Waiting for CI at ${sha}: ${run?.status ?? 'not registered yet'}`);
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Timed out waiting for CI; rerun this release after CI passes.');

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac-appsilicon
            image: ""
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-2022
            platform: win-amd64
            image: ""
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux-amd64
            image: ghcr.io/nekoos-group/nekocrate-linux-builder@sha256:dc91e5b86243c9114e7e70b10393b0a9c9ed94945b8194996591ae00a742ec7b
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
      packages: read
    container:
      # An empty image leaves the macOS/Windows jobs on their native runners.
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Install only the locked Tauri CLI
        run: |
          TAURI_CLI_VERSION=$(node -p 'require("./app/package-lock.json").packages["node_modules/@tauri-apps/cli"].version')
          npm install --prefix "$RUNNER_TEMP/tauri-cli" --no-audit --no-fund --package-lock=false "@tauri-apps/cli@$TAURI_CLI_VERSION"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.frontend_artifact }}
          run-id: ${{ needs.prepare.outputs.ci_run }}
          github-token: ${{ github.token }}
          path: app/dist
          merge-multiple: true
      - name: Verify frontend before compiling Rust
        run: python scripts/frontend_artifact.py verify app/dist
      - name: Ensure AppImage packaging tools
        if: runner.os == 'Linux'
        run: |
          # Older pinned builder images predate this packaging dependency.
          if ! command -v file >/dev/null; then
            bash scripts/install_linux_dependencies.sh file
          fi
          file --version
      - name: Build release installers
        run: node "$RUNNER_TEMP/tauri-cli/node_modules/@tauri-apps/cli/tauri.js" build --verbose --config src-tauri/tauri.release.conf.json --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --ci -- --locked
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify embedded frontend in the native executable
        run: python scripts/frontend_artifact.py embedded --target "${{ matrix.target }}"
      - name: Collect and verify architecture
        run: python scripts/release_assets.py collect --tag "$RELEASE_TAG" --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish preview release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify all platforms and checksums
        run: python scripts/release_assets.py verify --tag "$RELEASE_TAG"
      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/nekocrate-release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/nekocrate-release.json)" = true || { echo "Release already published; refusing to replace its assets."; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "猫咪盒子启动器 $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" artifacts/release/NekoCrate-Launcher-* artifacts/release/BUILDINFO.json artifacts/release/latest.json --clobber
          # A retried draft may contain legacy attachments from an older workflow.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
          while IFS= read -r asset; do
            case "$asset" in
              NekoCrate-Launcher-"$RELEASE_TAG"-*.sig|NekoCrate-Launcher-"$RELEASE_TAG"-*.app.zip|SHA256SUMS)
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
            esac
          done < "$RUNNER_TEMP/release-assets.txt"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file "docs/releases/$RELEASE_TAG.md"
