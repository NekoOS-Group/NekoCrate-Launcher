[workspace]
members = ["crates/nekocrate-core", "crates/nekocrate-cli", "app/src-tauri", "xtask"]
default-members = ["crates/nekocrate-core", "crates/nekocrate-cli"]
resolver = "2"

[workspace.package]
version = "0.9.3-dev.1"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "parking_lot", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
# Share the HTTP client with tauri-plugin-updater; retain ring for TLS.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "multipart", "stream", "rustls-no-provider", "http2", "system-proxy", "socks"] }
