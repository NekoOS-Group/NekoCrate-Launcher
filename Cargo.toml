[workspace]
members = ["crates/nekocrate-core", "crates/nekocrate-cli", "app/src-tauri"]
default-members = ["crates/nekocrate-core", "crates/nekocrate-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
