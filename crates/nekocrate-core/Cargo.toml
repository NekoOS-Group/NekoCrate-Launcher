[package]
name = "nekocrate-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "system-proxy", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
directories = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
fastnbt = "2.6.3"
tar = "0.4"
walkdir = "2"
regex = "1"
fs2 = "0.4"
semver = "1"
toml = "0.8"
sys-locale = "0.3"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_System_Console"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
