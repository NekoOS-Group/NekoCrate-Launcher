[package]
name = "nekocrate-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nekocrate_desktop"
# Desktop binaries only need the Rust library; mobile library outputs add links.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
nekocrate-core = { path = "../../crates/nekocrate-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tauri-plugin-updater = "~2.14.0"
reqwest.workspace = true
base64 = "0.23.1"
minisign-verify = "0.3"
semver = "1"
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
# Text only; retain the same X11/Wayland/native clipboard backend.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = { version = "2.1.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
